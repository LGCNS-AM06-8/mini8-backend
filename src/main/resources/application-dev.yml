server:
  port: 8000

spring:
  application:
    name: mini8-backend

  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # 테이블은 src/main/resources/db/mariadb/V*.sql 이 만든다
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/mariadb

  jpa:
    hibernate:
      ddl-auto: none        # 스키마는 Flyway 가 관리. 엔티티로 테이블 만들지 않음
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

jwt:
  secret: ${JWT_SECRET}
  access-expiry-ms: 1800000      # 30분
  refresh-expiry-ms: 604800000   # 7일

google:
  client-id: ${GOOGLE_CLIENT_ID}

gemini:
  api-key: ${GEMINI_API_KEY}
  prompt-version: v1             # 프롬프트 문구를 바꾸면 올린다 → 옛 가이드 캐시 자동 무효

app:
  cors-origin: http://localhost:5173   # FE 는 Vite (수업 CRA 의 3000 이 아님)
