server:
  port: 8000

spring:
  application:
    name: mini8-backend

  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update      # 표는 database/entity 의 JPA 엔티티가 만든다. 켜기 전 표 이름을 노션 명세와 맞출 것
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

jwt:
  secret: ${JWT_SECRET}
  access-expiry-ms: 86400000     # 24시간. 시연 중 만료 안 나게. 자동 재발급(F0b·S4)은 후순위
  refresh-expiry-ms: 604800000   # 7일

google:
  client-id: ${GOOGLE_CLIENT_ID}

gemini:
  api-key: ${GEMINI_API_KEY}
  prompt-version: v1             # 프롬프트 문구를 바꾸면 올린다 → 옛 가이드 캐시 자동 무효

app:
  cors-origins: http://localhost:8080,http://localhost:5173   # FE Vite 는 8080 (vite.config.ts). 5173 은 예비

collect:
  # 수집 단계가 만든 파일이 있는 폴더. 저장소에 넣기엔 커서(21MB) 각자 컴퓨터 경로를 .env 에 적는다
  # classified.jsonl · posts_12m*.jsonl 3개 · tech_dict.json 이 이 안에 있어야 한다
  data-dir: ${COLLECT_DATA_DIR:}
  # AI 1차 분류에 쓴 조건. 새 글을 분류할 때도 같아야 결과가 어긋나지 않는다 (C3)
  classify:
    model: gemini-3.5-flash-lite
    body-chars: 7000
    temperature: 0
