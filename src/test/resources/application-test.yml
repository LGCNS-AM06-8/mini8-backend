# gradlew test 용. MariaDB 없이 H2 (MariaDB 호환 모드) 에 같은 Flyway SQL 을 흘려 스키마까지 검증한다
spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:mini8;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/mariadb
  jpa:
    hibernate:
      ddl-auto: none

jwt:
  secret: test-only-secret-key-must-be-at-least-32-bytes-long
  access-expiry-ms: 1800000
  refresh-expiry-ms: 604800000

google:
  client-id: test-client-id

gemini:
  api-key: test-key
  prompt-version: v1

app:
  cors-origin: http://localhost:5173
